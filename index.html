<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangio | Joyería</title>
    <link rel="stylesheet" href="style.css">
    <!-- Íconos para los botones (opcional pero recomendado) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="container">
        <!-- Encabezado con Logo y Biografía -->
        <header class="profile">
            <!-- Cambia 'logo.png' por la imagen de tu dragón uróboros -->
            <img src="imagenes/Copia de LOGOTANGIO.png" alt="Logo de Tangio" class="profile-img">
            <h1 class="brand-name">Tangio</h1>
            <p class="bio">Joyería con significado. Realzamos tu estilo todos los días ✨</p>
        </header>

        <!-- Contenedor de Botones (Enlaces) -->
        <section class="links">
            <!-- Reemplaza "1234567890" por tu número real con código de país, ej: 52449... -->
            <a href="https://wa.me/524494400396" class="btn whatsapp" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-whatsapp"></i> Haz tu pedido por WhatsApp
            </a>

            <!-- Enlace al catálogo directo si lo tienen configurado en WA Business -->
            <a href="https://wa.me/c/521234567890" class="btn catalog" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-shopping-bag"></i> Ver Catálogo de Piezas
            </a>

            <!-- Enlace a Instagram -->
            <a href="https://www.instagram.com/tangio.accesorios/" class="btn outline" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-instagram"></i> Síguenos en Instagram
            </a>
        </section>
    </main>
</body>
</html>
